<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bagGrad" x1="18" y1="18" x2="78" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#43c3D1"/>
      <stop offset="1" stop-color="#0284FF"/>
    </linearGradient>

    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#061123" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer soft badge -->
  <rect x="10" y="10" width="76" height="76" rx="20" fill="white"/>
  <rect x="10.75" y="10.75" width="74.5" height="74.5" rx="19.25" stroke="#061123" stroke-opacity="0.08"/>

  <!-- BAG (very clear bag shape) -->
  <g filter="url(#shadow)">
    <!-- bag body -->
    <path
      d="M28 38c0-4.4 3.6-8 8-8h24c4.4 0 8 3.6 8 8v28c0 5.5-4.5 10-10 10H38c-5.5 0-10-4.5-10-10V38z"
      fill="url(#bagGrad)"
    />
    <!-- bag rim highlight -->
    <path
      d="M28 40.5h40"
      stroke="white"
      stroke-opacity="0.35"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- handle (thicker + obvious) -->
    <path
      d="M36 32.5c0-6.3 5-11.5 12-11.5s12 5.2 12 11.5"
      stroke="#061123"
      stroke-opacity="0.35"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>

  <!-- STYLISH S inside bag -->
  <path
    d="M60.5 46.2c-1.9-3.2-6-5.4-10.8-5.4c-6.2 0-10.8 3.0-10.8 7.5c0 3.7 2.6 5.7 8.1 6.8l5.7 1.2c3.8 0.8 5.4 1.7 5.4 3.6c0 2.6-2.8 4.6-6.9 4.6c-3.9 0-6.7-1.5-7.8-4.1"
    stroke="white"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- tiny price tag (commerce cue) -->
  <path
    d="M67.5 49.5l6 6c.7.7.7 1.9 0 2.6l-3.4 3.4c-.7.7-1.9.7-2.6 0l-6-6v-4z"
    fill="#061123"
    fill-opacity="0.22"
  />
  <circle cx="69.7" cy="52.6" r="1.3" fill="#061123" fill-opacity="0.35"/>
</svg>
